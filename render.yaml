# Render Blueprint for the API. Secrets are entered in the Render dashboard
# (`sync: false`) or generated by Render; no values live in the repo.
services:
  - type: web
    name: estate-assist-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm start --workspace server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: INGEST_API_KEY
        generateValue: true
      - key: JOBS_ENABLED
        value: 'true'
